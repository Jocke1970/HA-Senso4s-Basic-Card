name: Publish requested stable release
on:
  push:
    branches: [main]
    paths:
      - '.github/stable-release-request.txt'

jobs:
  publish:
    name: Validate and publish stable release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: senso4s-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable release request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          VERSION="$(tr -d '[:space:]' < .github/stable-release-request.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Stable release request must match YYYY.MM.patch"
            exit 1
          fi
          grep -Fq "VERSION=\"$VERSION\"" senso4s-card.js
          grep -Fq "VERSION=\"$VERSION\"" senso4s-basic-card.js
          test -s "RELEASE_NOTES_$VERSION.md"
          node -e "const m=require('./hacs.json'); if(m.name!=='Senso4s Card'||m.filename!=='senso4s-card.js'||m.content_in_root!==true)process.exit(1)"
      - name: Verify generated resources and syntax
        run: |
          node scripts/build.mjs --check
          node --check senso4s-card.js
          node --check senso4s-basic-card.js
      - name: Run full frontend regression suite
        run: node --test tests/*.test.cjs
      - name: Verify independent read-only frontend
        run: '! grep -i "wecamp" senso4s-card.js'
      - name: Create public stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/stable-release-request.txt)"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; no duplicate created"
            exit 0
          fi
          gh release create "$TAG" senso4s-card.js senso4s-basic-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Senso4s Card $VERSION" \
            --notes-file "RELEASE_NOTES_$VERSION.md" \
            --latest
