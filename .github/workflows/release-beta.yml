name: Publish requested beta release
on:
  push:
    branches: [beta]
    paths:
      - '.github/release-request.txt'

jobs:
  publish:
    name: Validate and publish explicit prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: senso4s-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate release request and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-request.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+b[0-9]+$ ]]; then
            echo "Release request does not match YYYY.MM.patchbN"
            exit 1
          fi
          grep -Fq "VERSION=\"$VERSION\"" senso4s-card.js
          test -s "RELEASE_NOTES_$VERSION.md"
          node -e "const m=require('./hacs.json');if(m.filename!=='senso4s-card.js'||m.name!=='Senso4s Card')process.exit(1)"
      - name: Validate generated assets
        run: |
          node scripts/build.mjs --check
          node --check senso4s-card.js
          node --check senso4s-basic-card.js
          node --test tests/*.test.cjs
      - name: Publish GitHub prerelease for beta commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-request.txt)"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes made"
            exit 0
          fi
          gh release create "$TAG" senso4s-card.js senso4s-basic-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Senso4s Card $VERSION (beta)" \
            --notes-file "RELEASE_NOTES_$VERSION.md" \
            --prerelease
